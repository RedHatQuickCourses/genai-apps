# MIG Topology Update for the Fake GPU Operator
#
# After applying the MIG annotation (6a-mig-node-config.yaml), the mig-faker
# DaemonSet processes the annotation but the device-plugin does NOT automatically
# update the node's allocatable resources. The device-plugin reads its resource
# inventory from this topology ConfigMap, so we must update it manually.
#
# This file:
#   1. Removes GPU 0 from the gpus list (it is now MIG-partitioned)
#   2. Adds three MIG profiles as otherDevices
#   3. Leaves GPUs 1-3 as whole devices
#
# After applying, restart the device-plugin pod so it re-reads this ConfigMap.
#
# IMPORTANT: Replace <worker-1-name> in both metadata.name and labels.node-name
#   with your actual node name. Also replace the GPU UUIDs if your cluster
#   generated different ones (check the existing ConfigMap first).
#
# Check existing ConfigMap:
#   oc get configmap topology-<worker-1-name> -n gpu-operator -o yaml
#
# Apply:  oc apply -f kueue-config/6b-mig-topology-update.yaml
# Then:   oc delete pod -n gpu-operator -l app=device-plugin -l nodeName=<worker-1-name>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: topology-worker-cluster-vnnbf-1    # <-- REPLACE with topology-<worker-1-name>
  namespace: gpu-operator
  labels:
    node-name: worker-cluster-vnnbf-1     # <-- REPLACE with <worker-1-name>
    node-topology: "true"
data:
  topology.yml: |
    gpuMemory: 40960
    gpuProduct: NVIDIA-A100-SXM4-40GB
    gpus:
        - id: GPU-3cd5e88a-e888-5bfb-939a-e93761022345
          status:
            allocatedBy:
                namespace: ""
                pod: ""
                container: ""
            podGpuUsageStatus: {}
        - id: GPU-68b11f81-2618-5b61-b187-4a25afe7205b
          status:
            allocatedBy:
                namespace: ""
                pod: ""
                container: ""
            podGpuUsageStatus: {}
        - id: GPU-c9b00e75-53dc-5bec-a55b-842f82213d8a
          status:
            allocatedBy:
                namespace: ""
                pod: ""
                container: ""
            podGpuUsageStatus: {}
    migStrategy: mixed
    otherDevices:
        - name: nvidia.com/mig-3g.20gb
          count: 1
        - name: nvidia.com/mig-2g.10gb
          count: 1
        - name: nvidia.com/mig-1g.5gb
          count: 1
