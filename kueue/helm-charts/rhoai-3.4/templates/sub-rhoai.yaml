{{- if .Values.rhoai.enabled }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: {{ .Values.rhoai.namespace }}
  labels:
    {{- include "rhoai.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.rhoai.channel }}
  installPlanApproval: Automatic
  name: rhods-operator
  source: {{ .Values.catalog.source }}
  sourceNamespace: {{ .Values.catalog.sourceNamespace }}
{{- end }}
