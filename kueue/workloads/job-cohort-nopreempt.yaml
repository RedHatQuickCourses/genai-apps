apiVersion: batch/v1
kind: Job
metadata:
  name: training-fill-4
  namespace: training-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-queue
spec:
  suspend: true
  template:
    metadata:
      annotations:
        run.ai/simulated-gpu-utilization: "75-90"
    spec:
      restartPolicy: Never
      containers:
      - name: training-workload
        image: registry.access.redhat.com/ubi9/ubi
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "========================================="
          echo "  Training Fill Job 4 (SHOULD STAY PENDING)"
          echo "  Queue: training-queue -> a100-cluster-queue"
          echo "  All 4 A100 GPUs are in use (3 training + 1"
          echo "  lent to inference). Without reclaimWithinCohort,"
          echo "  Kueue cannot preempt the borrowed inference"
          echo "  pod. This job will remain Pending."
          echo "  Node: $NODE_NAME"
          echo "========================================="
          END=$((SECONDS+300))
          while [ $SECONDS -lt $END ]; do
            echo "--- $(date) ---"
            nvidia-smi
            echo ""
            sleep 5
          done
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
