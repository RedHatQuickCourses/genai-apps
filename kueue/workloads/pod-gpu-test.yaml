apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-a100
  namespace: default
  annotations:
    run.ai/simulated-gpu-utilization: "60-90"
spec:
  nodeSelector:
    run.ai/simulated-gpu-node-pool: a100-pool
  tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
  containers:
  - name: gpu-container
    image: registry.access.redhat.com/ubi9/ubi
    command: ["sleep", "infinity"]
    resources:
      limits:
        nvidia.com/gpu: 1
    env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
---
