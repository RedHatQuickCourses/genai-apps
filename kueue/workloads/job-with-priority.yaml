apiVersion: batch/v1
kind: Job
metadata:
  name: training-job-low-wpc
  namespace: training-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-queue
    kueue.x-k8s.io/priority-class: low-priority
spec:
  suspend: true
  template:
    metadata:
      annotations:
        run.ai/simulated-gpu-utilization: "40-60"
    spec:
      restartPolicy: Never
      containers:
      - name: training-workload
        image: registry.access.redhat.com/ubi9/ubi
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "=== Job: training-job-low-wpc (low-priority: 100) ==="
          echo "Node: $NODE_NAME"
          echo "GPUs requested: 2"
          echo ""
          END=$((SECONDS+300))
          while [ $SECONDS -lt $END ]; do
            echo "--- $(date) ---"
            nvidia-smi
            echo ""
            sleep 5
          done
          echo "=== Job complete after 5 minutes ==="
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "2"
          limits:
            nvidia.com/gpu: "2"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
---
