apiVersion: batch/v1
kind: Job
metadata:
  name: training-reclaim-4
  namespace: training-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-queue
spec:
  suspend: true
  template:
    metadata:
      annotations:
        run.ai/simulated-gpu-utilization: "75-90"
    spec:
      restartPolicy: Never
      containers:
      - name: training-workload
        image: registry.access.redhat.com/ubi9/ubi
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "========================================="
          echo "  Training Reclaim Job 4 (TRIGGERS RECLAIM)"
          echo "  Queue: training-queue -> a100-cluster-queue"
          echo "  This job needs the GPU that inference"
          echo "  borrowed. With reclaimWithinCohort: Any,"
          echo "  Kueue preempts the borrowed inference pod"
          echo "  to reclaim the GPU for training."
          echo "  Node: $NODE_NAME"
          echo "========================================="
          echo ""
          END=$((SECONDS+300))
          while [ $SECONDS -lt $END ]; do
            echo "--- $(date) ---"
