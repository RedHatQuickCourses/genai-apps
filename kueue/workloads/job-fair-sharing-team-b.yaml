apiVersion: batch/v1
kind: Job
metadata:
  name: team-b-job-1
  namespace: team-b-jobs
  labels:
    kueue.x-k8s.io/queue-name: team-b-queue
spec:
  suspend: true
  template:
    metadata:
      annotations:
        run.ai/simulated-gpu-utilization: "60-80"
    spec:
      restartPolicy: Never
      containers:
      - name: training-workload
        image: registry.access.redhat.com/ubi9/ubi
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "========================================="
          echo "  Team B - Job 1 (DRS PREEMPTION)"
          echo "  Queue: team-b-queue -> team-b-cluster-queue"
          echo "  fairSharing.weight: 2 | Quota: 1 GPU"
          echo "  Team A has higher DRS (weightedShare) because"
          echo "  it is borrowing. Kueue preempts Team A's"
          echo "  borrowed job to admit this one."
          echo "  Node: $NODE_NAME"
          echo "========================================="
          echo ""
          END=$((SECONDS+300))
          while [ $SECONDS -lt $END ]; do
            echo "--- $(date) ---"
            nvidia-smi
            echo ""
            sleep 5
          done
          echo "=== Job complete after 5 minutes ==="
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
---
apiVersion: batch/v1
kind: Job
metadata:
  name: team-b-job-2
  namespace: team-b-jobs
  labels:
    kueue.x-k8s.io/queue-name: team-b-queue
spec:
  suspend: true
  template:
    metadata:
      annotations:
        run.ai/simulated-gpu-utilization: "70-90"
    spec:
      restartPolicy: Never
      containers:
      - name: training-workload
        image: registry.access.redhat.com/ubi9/ubi
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "========================================="
          echo "  Team B - Job 2 (PENDING)"
          echo "  Queue: team-b-queue -> team-b-cluster-queue"
          echo "  fairSharing.weight: 2 | Quota: 1 GPU"
          echo "  All 3 GPUs are at nominal — no preemption"
          echo "  target. This job waits until capacity frees."
          echo "  Node: $NODE_NAME"
          echo "========================================="
          echo ""
          END=$((SECONDS+300))
          while [ $SECONDS -lt $END ]; do
            echo "--- $(date) ---"
            nvidia-smi
            echo ""
            sleep 5
          done
          echo "=== Job complete after 5 minutes ==="
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
