# Admission Fair Sharing — Round 1 (Research Only)
#
# Two Research jobs fill both GPU slots in the shared-gpu-queue.
# This builds usage history for the research-queue LocalQueue.
# After these complete, round 2 tests whether Kueue prioritizes
# the production-queue (which has zero historical usage).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: research-round1-job-1
  namespace: training-jobs
  labels:
    kueue.x-k8s.io/queue-name: research-queue
spec:
  suspend: true
  template:
    metadata:
      annotations:
        run.ai/simulated-gpu-utilization: "70-90"
    spec:
      restartPolicy: Never
      containers:
      - name: training-workload
        image: registry.access.redhat.com/ubi9/ubi
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "========================================="
          echo "  Research Round 1 - Job 1"
          echo "  Queue: research-queue -> shared-gpu-queue"
          echo "  Admission Fair Sharing: building usage"
          echo "  Node: $NODE_NAME"
          echo "========================================="
          echo ""
          END=$((SECONDS+300))
          while [ $SECONDS -lt $END ]; do
            echo "--- $(date) ---"
            nvidia-smi
            echo ""
            sleep 5
          done
          echo "=== Job complete after 5 minutes ==="
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
---
apiVersion: batch/v1
kind: Job
metadata:
  name: research-round1-job-2
  namespace: training-jobs
  labels:
    kueue.x-k8s.io/queue-name: research-queue
spec:
  suspend: true
  template:
    metadata:
      annotations:
        run.ai/simulated-gpu-utilization: "60-80"
    spec:
      restartPolicy: Never
      containers:
      - name: training-workload
        image: registry.access.redhat.com/ubi9/ubi
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "========================================="
          echo "  Research Round 1 - Job 2"
          echo "  Queue: research-queue -> shared-gpu-queue"
          echo "  Admission Fair Sharing: building usage"
          echo "  Node: $NODE_NAME"
          echo "========================================="
          echo ""
          END=$((SECONDS+300))
          while [ $SECONDS -lt $END ]; do
            echo "--- $(date) ---"
            nvidia-smi
            echo ""
            sleep 5
          done
          echo "=== Job complete after 5 minutes ==="
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
